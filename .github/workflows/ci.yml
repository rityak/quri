name: Go checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./... -count=1 -timeout=3m
      - run: go vet ./...
      - run: go test ./transport -run '^$' -bench BenchmarkDatagramCodec -benchmem
      - name: Fuzz binary parsers
        run: |
          go test ./transport -run '^$' -fuzz '^FuzzDatagram$' -fuzztime=5s
          go test ./transport -run '^$' -fuzz '^FuzzCapsule$' -fuzztime=5s
          go test ./client -run '^$' -fuzz '^FuzzProfileLink$' -fuzztime=5s
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: golangci-lint config verify
      - run: golangci-lint run ./...
