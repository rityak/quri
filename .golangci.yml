version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - goconst
    - revive
  settings:
    errcheck:
      check-blank: true
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: var-naming
  exclusions:
    presets: []
